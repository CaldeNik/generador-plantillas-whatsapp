<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Plantillas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">

        <div class="top-bar">
            <h2>Plantillas WhatsApp</h2>

            <label class="switch">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider"></span>
            </label>
        </div>

        <select id="plantilla"></select>

        <div id="campos"></div>

        <input 
            type="text" 
            id="telefono" 
            placeholder="Número de WhatsApp (ej: 5491123456789)"
        >

        <button id="enviarBtn">Enviar</button>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
